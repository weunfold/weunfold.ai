# Deploys site/ to GitHub Pages on every push to dev. When the push is a merged pull request,
# it first bumps the version (tools/bump.mjs), rebuilds, commits "Release vX.Y" and tags it.
name: Release and deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Was this push a merged pull request?
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.actor }}" = "github-actions[bot]" ]; then echo "merged=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "dev")] | length')
          echo "merged=$n" >> "$GITHUB_OUTPUT"

      - name: Bump, rebuild, commit and tag
        if: steps.pr.outputs.merged != '0'
        run: |
          v=$(node tools/bump.mjs)
          node tools/build.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$v"
          git tag "v$v"
          git push origin dev --follow-tags

      - name: Generated files are current
        run: node tools/build.mjs --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
